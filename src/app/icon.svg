<!--
  Icono del sitio. Next lo detecta por convención (app/icon.svg) y emite el
  <link rel="icon">, así el navegador deja de pedir /favicon.ico.

  [PLACEHOLDER]: monograma provisional con los colores del sistema de diseño
  (azul profundo de fondo, acento rojo, letra en blanco). Se reemplaza por el
  logo real cuando la corporación lo entregue.

  Una sola letra a propósito: a 16 px "TSW" no se lee.
-->
